<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KINZ CATCHET | Luxury Nigerian Menswear</title>
  <style>
    @keyframes fadeUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-25px); } 100% { transform: translateY(0px); } }
    @keyframes glow { 0% { box-shadow: 0 0 5px #D4AF37; } 50% { box-shadow: 0 0 30px #D4AF37; } 100% { box-shadow: 0 0 5px #D4AF37; } }
    @keyframes walk { 0% { left: -100px; } 100% { left: 110%; } }
    @keyframes sew { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
    @keyframes fly { 0% { top: 10%; left: 0%; } 25% { top: 20%; left: 50%; } 50% { top: 10%; left: 100%; } 75% { top: 30%; left: 50%; } 100% { top: 10%; left: 0%; } }
    
    .fade-in { opacity:0; transform:translateY(40px); transition: all 1.2s ease-out; }
    .fade-in.show { opacity:1; transform:translateY(0); }
    .float-particle { position: fixed; z-index:0; width: 5px; height: 5px; background: #D4AF37; border-radius: 50%; animation: float 6s infinite ease-in-out; }
    .glow-btn { animation: glow 2s infinite; }
    
    /* CARTOON ANIMALS */
    .animal { position: fixed; z-index:2; font-size: 60px; }
    .lion { bottom: 10%; animation: walk 15s linear infinite; }
    .cat { bottom: 15%; right: 10%; animation: sew 1s ease-in-out infinite; }
    .bird { top: 10%; animation: fly 20s linear infinite; }
    
    body { margin:0; font-family:'Georgia', serif; background:#000; color:#fff; overflow:hidden; }
  </style>
</head>
<body>

<div id="particles"></div>

<!-- CARTOON ANIMALS -->
<div class="animal lion">🦁</div> <!-- King Lion walking -->
<div class="animal cat">🐱</div> <!-- Tailor Cat sewing -->
<div class="animal bird">🦅</div> <!-- Eagle flying -->

<!-- HERO -->
<div style="text-align:center; padding:140px 20px 120px; background:linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('banner.jpg') center/cover; height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; position:relative; z-index:1;">
  
  <h1 class="fade-in" style="font-size:70px; color:#D4AF37; letter-spacing:8px; margin:0; text-shadow: 0 0 20px #D4AF37;">KINZ CATCHET</h1>
  <p class="fade-in" style="font-size:26px; transition-delay:0.4s;">Stitched To Perfection</p>
  <p class="fade-in" style="font-size:20px; color:#ccc; transition-delay:0.6s;">Where Kings Are Tailored 👑</p>
  
  <a href="collection.html" class="fade-in glow-btn" 
  style="background:#D4AF37; color:#000; padding:20px 50px; font-weight:bold; font-size:18px; margin-top:40px; border-radius:50px; transition-delay:0.8s; text-decoration:none;">
  🎁 VIEW OUR COLLECTION
  </a>
</div>

<script>
  // 1. CREATE FLOATING GOLD PARTICLES
  function createParticles() {
    const container = document.getElementById('particles');
    for(let i = 0; i < 30; i++) {
      let particle = document.createElement('div');
      particle.className = 'float-particle';
      particle.style.left = Math.random() * 100 + '%';
      particle.style.top = Math.random() * 100 + '%';
      particle.style.animationDelay = Math.random() * 6 + 's';
      container.appendChild(particle);
    }
  }
  createParticles();
  
  // 2. FADE IN ON LOAD
  window.addEventListener('load', () => { 
    document.querySelectorAll('.fade-in').forEach((el, i) => { 
      setTimeout(() => el.classList.add('show'), i * 400); 
    }) 
  });
</script>

</body>
</html>
